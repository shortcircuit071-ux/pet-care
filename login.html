{% extends 'base.html' %}
{% block content %}
<article style="max-width: 500px; margin: auto;">
    <h2>Sign In</h2>
    <form method="POST">
        <label>Email Address</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Log In</button>
    </form>
</article>
{% endblock %}
